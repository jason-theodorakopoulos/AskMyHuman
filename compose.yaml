# Local development only. Credentials here are throwaway and must never be reused.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askmyhuman
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: askmyhuman
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmyhuman -d askmyhuman"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://askmyhuman:localdev@db:5432/askmyhuman
      # Placeholders that satisfy startup validation; no Azure call is made locally.
      ACS_ENDPOINT: https://local.communication.azure.com
      ACS_SOURCE_PHONE_NUMBER: "+15555550100"
      AZURE_AI_ENDPOINT: https://local.cognitiveservices.azure.com
      ACS_CALLBACK_AUDIENCE: local-acs-immutable-resource-id
      ACS_CALLBACK_URL: https://local.example.invalid/v1/callbacks/acs
      ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AUTHORIZED_AGENT_APP_IDS: 00000000-0000-0000-0000-000000000000
      MCP_ALLOWED_HOSTS: localhost:8000,127.0.0.1:8000
